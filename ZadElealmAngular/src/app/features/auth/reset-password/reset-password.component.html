<div class="auth-card">
  <div class="card-header">
    <p class="tag">كلمة مرور جديدة</p>
    <h2>أعد تعيين كلمة المرور</h2>
    <p>بعد التحقق من الرمز يمكنك الآن إنشاء كلمة مرور جديدة.</p>
  </div>

  @if (successMessage()) {
    <div class="alert success">{{ successMessage() }}</div>
  }

  @if (serverMessage()) {
    <div class="alert error">{{ serverMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>البريد الإلكتروني</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="field">
      <span>كلمة المرور الجديدة</span>
      <div class="password-field">
        <input
          [type]="hidePassword() ? 'password' : 'text'"
          formControlName="newPassword"
          placeholder="8 أحرف أو أكثر"
          autocomplete="new-password"
        />
        <button type="button" class="text-button" (click)="hidePassword.set(!hidePassword())">
          {{ hidePassword() ? 'إظهار' : 'إخفاء' }}
        </button>
      </div>
    </label>

    <label class="field">
      <span>تأكيد كلمة المرور</span>
      <div class="password-field">
        <input
          [type]="hideConfirmPassword() ? 'password' : 'text'"
          formControlName="confirmPassword"
          placeholder="أعد كتابة كلمة المرور"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="text-button"
          (click)="hideConfirmPassword.set(!hideConfirmPassword())"
        >
          {{ hideConfirmPassword() ? 'إظهار' : 'إخفاء' }}
        </button>
      </div>
      @if (confirmPasswordMessage) {
        <small class="field-error">{{ confirmPasswordMessage }}</small>
      }
    </label>

    <button type="submit" class="primary-button" [disabled]="submitDisabled()">
      {{ isSubmitting() ? 'جارٍ الحفظ...' : 'حفظ كلمة المرور' }}
    </button>
  </form>

  <p class="form-footer">
    تريد العودة؟
    <a routerLink="/login">تسجيل الدخول</a>
  </p>
</div>

<div class="auth-card">
  <div class="card-header">
    <p class="tag">استعادة الحساب</p>
    <h2>نسيت كلمة المرور؟</h2>
    <p>أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق لإعادة تعيين كلمة المرور.</p>
  </div>

  @if (successMessage()) {
    <div class="alert success">{{ successMessage() }}</div>
  }

  @if (serverMessage()) {
    <div class="alert error">{{ serverMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>البريد الإلكتروني</span>
      <input type="email" formControlName="email" placeholder="name@example.com" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">أدخل بريدًا إلكترونيًا صحيحًا.</small>
      }
    </label>

    <button type="submit" class="primary-button" [disabled]="submitDisabled()">
      {{ isSubmitting() ? 'جارٍ الإرسال...' : 'إرسال الرمز' }}
    </button>
  </form>

  <p class="form-footer">
    تذكرت كلمة المرور؟
    <a routerLink="/login">ارجع لتسجيل الدخول</a>
  </p>
</div>

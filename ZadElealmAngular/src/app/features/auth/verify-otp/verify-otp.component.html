<div class="auth-card">
  <div class="card-header">
    <p class="tag">التحقق</p>
    <h1>أدخل رمز التحقق</h1>
    <p>استخدم الرمز الذي وصلك على البريد الإلكتروني لإكمال استعادة الحساب.</p>
  </div>

  @if (successMessage()) {
    <div class="alert success">{{ successMessage() }}</div>
  }

  @if (serverMessage()) {
    <div class="alert error">{{ serverMessage() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>البريد الإلكتروني</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">أدخل بريدًا إلكترونيًا صحيحًا.</small>
      }
    </label>

    <label class="field">
      <span>رمز التحقق</span>
      <input type="text" formControlName="otp" placeholder="أدخل الرمز" inputmode="numeric" />
      @if (form.controls.otp.touched && form.controls.otp.invalid) {
        <small class="field-error">أدخل رمز التحقق كما وصل إليك.</small>
      }
    </label>

    <button type="submit" class="primary-button" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'جارٍ التحقق...' : 'تحقق من الرمز' }}
    </button>
  </form>

  <p class="form-footer">
    لم يصلك شيء؟
    <a [routerLink]="['/forgot-password']" [queryParams]="{ email: form.controls.email.value }"
      >أعد الإرسال</a
    >
  </p>
</div>

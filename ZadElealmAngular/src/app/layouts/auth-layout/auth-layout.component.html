<a class="skip-link" href="#auth-content">تخطَّ إلى المحتوى</a>
<div class="auth-shell">
  <section class="brand-panel">
    <div class="brand-navigation">
      <a class="brand-link" routerLink="/" aria-label="زاد تعلم - الرئيسية">
        <img src="assets/brand/logo-full-light.svg" alt="زاد تعلم" class="brand-logo" />
      </a>
      <a class="back-link" routerLink="/">العودة للرئيسية</a>
    </div>

    <div class="brand-copy">
      <p class="eyebrow">منصة زاد العلم التعليمية</p>
      <blockquote>{{ knowledgeQuote }}</blockquote>
      <p class="supporting-text">
        تعلّم بخطوات واضحة، وتابع دروسك واختباراتك وإنجازاتك من مكان واحد.
      </p>

      <ul class="trust-list">
        @for (point of trustPoints; track point) {
          <li>{{ point }}</li>
        }
      </ul>
    </div>
    <svg class="auth-ornament" viewBox="0 0 240 240" aria-hidden="true" focusable="false">
      <path d="m120 8 31 65 81 47-81 47-31 65-31-65-81-47 81-47Z" />
      <circle cx="120" cy="120" r="78" />
      <path d="M42 120h156M120 42v156M65 65l110 110M175 65 65 175" />
    </svg>
  </section>

  <main id="auth-content" class="form-panel">
    <router-outlet />
  </main>
</div>

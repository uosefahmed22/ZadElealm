<div class="auth-shell">
  <section class="brand-panel">
    <a class="brand-link" routerLink="/" aria-label="زاد العلم">
      <img src="/assets/brand/logo.png" alt="Zad Elealm logo" class="brand-logo" />
      <span>زاد العلم</span>
    </a>

    <div class="brand-copy">
      <p class="eyebrow">منصة زاد العلم التعليمية</p>
      <h1>رحلة تعلّم أبسط، وتقدّم تراه كل يوم.</h1>
      <p class="supporting-text">
        تابع دروسك واختباراتك وإنجازاتك من مكان واحد، بتجربة عربية واضحة ومريحة.
      </p>

      <ul class="trust-list">
        @for (point of trustPoints; track point) {
          <li>{{ point }}</li>
        }
      </ul>
    </div>
  </section>

  <section class="form-panel">
    <router-outlet />
  </section>
</div>
